name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., v1.2.3)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 需要写入权限来提交 VERSION、推送 tag 并发布 Release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main # 总是检出 main 分支
          fetch-depth: 0 # goreleaser 需要完整历史与标签
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Validate and use input version
        id: get_version
        run: |
          VERSION=${{ github.event.inputs.version }}

          # 验证版本格式 vX.Y.Z
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version does not match pattern vX.Y.Z"
            exit 1
          fi

          # tag 用带 v 前缀，VERSION 文件沿用仓库现有格式（不带 v）
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RAW_VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          echo "Using input version: $VERSION"

      - name: Update VERSION file
        run: |
          # envmerge 的规范版本存于 VERSION 文件；
          # internal/cli.Version 在构建时通过 -ldflags 注入，无需改动源码。
          printf '%s\n' "$RAW_VERSION" > VERSION
          echo "Updated VERSION file to $RAW_VERSION"

      - name: Commit and push changes directly
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add VERSION
          git commit -m "chore: release $VERSION"
          git push

      - name: Create and push tag
        run: |
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "Tag $VERSION created and pushed successfully"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output completion message
        run: |
          echo "Version updated to $VERSION"
          echo "Tag $VERSION created and GitHub Release published by GoReleaser"
